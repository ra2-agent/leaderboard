name: Static validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted
          persist-credentials: false
      - name: Checkout submitted files as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .submission
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Test trusted validation and rating logic
        run: node --test .trusted/tests/*.test.mjs
      - name: Validate submitted data without running Agent code
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node .trusted/scripts/check.mjs .submission
